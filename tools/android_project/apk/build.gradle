apply plugin: 'com.android.application'

// Stand-alone SkyEmu app: packages the :app library (libSkyEmu.so and EnhancedNativeActivity)
// as an installable APK. Host apps that embed SkyEmu depend on :app directly instead.
android {
    namespace 'com.sky.SkyEmu.standalone'
    compileSdk 36
    // Same NDK as :app, so the release build can strip debug symbols from libSkyEmu.so.
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.sky.SkyEmu'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '6.1-omega'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs by sideloading. Sign with your own
            // key (apksigner) before publishing it anywhere.
            signingConfig signingConfigs.debug
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation project(':app')
    // AndroidX pulls kotlin-stdlib 1.8 alongside the old split -jdk7/-jdk8 artifacts; align them.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
