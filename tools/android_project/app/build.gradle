apply plugin: 'com.android.library'

// ABIs to build, for example -PskyemuAbis=arm64-v8a for a quicker local build
def skyemuAbis = (project.findProperty('skyemuAbis') ?: 'arm64-v8a,armeabi-v7a,x86_64,x86').split(',')

android {
    namespace = "com.skyemu"
    compileSdkVersion 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        consumerProguardFiles 'consumer-rules.pro'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID=1', '-DNDK_DEBUG=0', '-DHAVE_LIBZ=0', '-DCMAKE_BUILD_TYPE=RELWITHDEBINFO', "-DANDROID_ARM_NEON=TRUE"
                targets "SkyEmu"
            }
        }
        ndk {
            abiFilters(*skyemuAbis)
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    externalNativeBuild {
        cmake {
            version '3.22.1'
            path '../../../CMakeLists.txt'
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
            excludes += ['**/libz.so']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.browser:browser:1.5.0'
}
