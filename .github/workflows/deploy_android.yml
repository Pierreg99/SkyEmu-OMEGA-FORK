name: Build Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned SDK, NDK and CMake
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build Android library for all four ABIs
        working-directory: tools/android_project
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2
      - name: Verify 16 KB native library alignment
        run: python3 tools/verify_android_pages.py tools/android_project/app/build/outputs/aar/app-release.aar
      - uses: actions/upload-artifact@v7
        with:
          name: AndroidRelease-AAR
          path: tools/android_project/app/build/outputs/aar/app-release.aar
          if-no-files-found: error
