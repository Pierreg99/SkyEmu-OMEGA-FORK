name: Build Android
on: [push,pull_request]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build 🔧
        # The app (APK) and the library host apps embed (AAR)
        run: |
          cd tools/android_project/
          ./gradlew :standalone:assembleRelease :app:assembleRelease --no-daemon
          ls standalone/build/outputs/apk/release/ app/build/outputs/aar/
      - name: Upload the app 🚀
        uses: actions/upload-artifact@v4
        with:
           name: AndroidRelease
           path: tools/android_project/standalone/build/outputs/apk/release/SkyEmu-v*-release.apk
      - name: Upload the library 📚
        uses: actions/upload-artifact@v4
        with:
           name: AndroidLibrary
           path: tools/android_project/app/build/outputs/aar/app-release.aar
