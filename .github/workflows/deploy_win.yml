name: Build Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build x64 DLL using the installed Windows SDK
        run: |
          cmake --preset windows-release
          cmake --build --preset windows-release --parallel 2
      - name: Run runtime and design regression tests
        run: ctest --preset windows-release
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsRelease-${{ matrix.os }}
          path: build/windows-release/bin/Release/SkyEmu.*
          if-no-files-found: error
