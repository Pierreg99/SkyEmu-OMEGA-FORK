name: Build iOS
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Configure & Build 🔧
        # The app bundle; host apps use the static library (the default, BUILD_IOS_STATIC_LIB=ON)
        run: |
          cmake -B build -GXcode -DSOKOL_BACKEND=SOKOL_METAL -DCMAKE_SYSTEM_NAME=iOS -DBUILD_IOS_STATIC_LIB=OFF
          cmake --build build --config Release -- -quiet
      - name: Package (unsigned) 📦
        run: |
          cd build
          mkdir Payload
          cp -R bin/Release/SkyEmu.app Payload/SkyEmu.app
          zip -qr SkyEmu.ipa Payload
      - name: Upload 🚀
        uses: actions/upload-artifact@v7
        with:
          name: iOSRelease
          path: build/SkyEmu.ipa
