name: Build Linux
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev libsdl2-dev libssl-dev libcurl4-openssl-dev
      - name: Configure and build
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release --parallel 2
          cmake --build build/linux-release --target skyemu_libretro --parallel 2
      - name: Run regression tests
        run: ctest --preset linux-release
      - uses: actions/upload-artifact@v4
        with:
          name: LinuxRelease-${{ matrix.os }}
          path: |
            build/linux-release/bin/
            build/linux-release/skyemu_libretro.so
          if-no-files-found: error
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with memory and undefined behavior checks
        run: |
          cmake --preset runtime-tests -DSKYEMU_ENABLE_SANITIZERS=ON
          cmake --build --preset runtime-tests --parallel 2
          ctest --preset runtime-tests
