name: Build Linux
on: [push,pull_request]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v2.3.1 
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libasound2-dev
      - name: Configure & Build 🔧 
        run: |
          mkdir build
          cd build
          cmake .. && cmake --build .

      - name: Design token tests 🎨
        run: |
          cc -O2 -Wall -Wextra -DSE_PLATFORM_LINUX -Isrc tools/se_design_test.c src/se_design.c -lm -lX11 -o se_design_test
          ./se_design_test

      - name: ROM patch tests 🩹
        run: |
          cc -O2 -Wall -Wextra -Isrc tools/se_patch_test.c src/se_patch.c -o se_patch_test
          ./se_patch_test
      - name: Cheat finder tests 🔎
        run: |
          cc -O2 -Wall -Wextra -Isrc tools/se_cheat_finder_test.c src/se_cheat_finder.c -o se_cheat_finder_test
          ./se_cheat_finder_test
      - name: Recorder tests 🎬
        run: |
          cc -O2 -Wall -Wextra -Isrc tools/se_record_test.c src/se_record.c src/stb.c -lm -o se_record_test
          ./se_record_test
      - name: Screen layout tests 🖥️
        run: |
          cc -O2 -Wall -Wextra -Isrc tools/se_screen_layout_test.c src/se_screen_layout.c -lm -o se_screen_layout_test
          ./se_screen_layout_test
          
      - name: GH Release 🚀
        # You may pin to the exact commit or the version.
        uses: actions/upload-artifact@v4
        with:
           name: LinuxRelease
           path: build/bin/
        #uses: softprops/action-gh-release@v0.1.5
        #with:
        #  # Note-worthy description of changes in release
        #  # body: # optional
        #  # Path to load note-worthy description of changes in release from
        #  # body_path: # optional
        #  # Gives the release a custom name. Defaults to tag name
        #  name: LinuxRelease
        #  # Identify the release as a prerelease. Defaults to false
        #  prerelease: True
        #  # Newline-delimited list of path globs for asset files to upload
        #  files: build/bin/*
 
