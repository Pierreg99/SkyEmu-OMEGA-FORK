name: Build Linux (Libretro)
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Install dependencies
        # Not used by the core, but find_package needs them
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libasound2-dev
      - name: Configure & Build 🔧
        run: |
          cmake -B build -DRETRO_CORE_ONLY=ON
          cmake --build build --target skyemu_libretro --config Release --parallel "$(nproc)"
          cd build && zip skyemu_libretro.zip skyemu_libretro.so ../skyemu_libretro.info
      - name: Upload 🚀
        uses: actions/upload-artifact@v7
        with:
          name: LinuxRelease (Libretro)
          path: build/skyemu_libretro.zip
